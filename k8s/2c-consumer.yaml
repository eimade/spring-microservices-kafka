apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: uimad-ref
spec:
  replicas: 2
  selector: { matchLabels: { app: consumer } }
  template:
    metadata: { labels: { app: consumer } }
    spec:
      containers:
        - name: consumer
          image: uimad-ref/consumer:1.0.0
          ports: [{ containerPort: 18301 }]
          envFrom:
            - configMapRef: { name: uimad-ref-config }
            - secretRef: { name: uimad-ref-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 18301 }
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: { path: /actuator/health, port: 18301 }
            initialDelaySeconds: 40
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: consumer
  namespace: uimad-ref
spec:
  selector: { app: consumer }
  ports: [{ port: 18301, targetPort: 18301 }]
