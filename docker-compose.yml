# Lancement : docker compose up --build
# Ports hôte peu courants pour éviter les conflits locaux.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uimadref
      POSTGRES_USER: uimadref
      POSTGRES_PASSWORD: uimadref
    ports: ["15435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uimadref -d uimadref"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27018:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports: ["19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 12

  referentiel:
    build:
      context: .
      args: { MODULE: referentiel }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/uimadref
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["18300:18300"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  consumer:
    build:
      context: .
      args: { MODULE: consumer }
    environment:
      MONGO_URI: mongodb://mongo:27017/uimadref
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["18301:18301"]
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }

  # Profil optionnel : docker compose --profile oracle up oracle
  oracle:
    image: gvenzl/oracle-xe:21-slim
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: uimadref
      APP_USER_PASSWORD: uimadref
    ports: ["11521:1521"]
