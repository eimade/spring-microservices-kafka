name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build et tests (JUnit 5 + Testcontainers Kafka, PostgreSQL, MongoDB)
        run: ./mvnw -B verify

  kubernetes-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cluster kind éphémère
        uses: helm/kind-action@v1
      - name: kubectl apply --dry-run=server
        run: kubectl apply --dry-run=server -f k8s/

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
